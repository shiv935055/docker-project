apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui-1
  namespace: argo-app-1
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui-1
  template:
    metadata:
      labels:
        app: guestbook-ui-1
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:v4
          name: guestbook-ui-1
          ports:
            - containerPort: 80
# this is very well
